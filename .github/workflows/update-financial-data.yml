name: Update Financial Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download latest Federal Reserve data
        run: |
          python <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone

          SERIES = {
              "federal_funds_rate": "DFF",
              "bank_prime_loan_rate": "DPRIME",
              "interest_on_reserve_balances": "IORB"
          }

          def latest_observation(series_id):
              url = (
                  "https://fred.stlouisfed.org/graph/"
                  f"fredgraph.csv?id={series_id}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "MoneyTrackTemplates Financial Data Bot"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  text = response.read().decode("utf-8-sig")

              reader = csv.DictReader(io.StringIO(text))

              if not reader.fieldnames:
                  raise RuntimeError(
                      f"No CSV columns returned for {series_id}"
                  )

              # FRED's date-column label can vary.
              # The series value is identified by its series ID,
              # so the remaining column is treated as the date.
              date_columns = [
                  column
                  for column in reader.fieldnames
                  if column != series_id
              ]

              if not date_columns:
                  raise RuntimeError(
                      f"Could not identify date column for {series_id}. "
                      f"Columns returned: {reader.fieldnames}"
                  )

              date_column = date_columns[0]

              rows = list(reader)

              for row in reversed(rows):
                  value = row.get(series_id)

                  if value and value.strip() not in ("", "."):
                      return {
                          "value": float(value),
                          "observation_date":
                              row.get(date_column)
                      }

              raise RuntimeError(
                  f"No valid observations found for {series_id}"
              )

          federal_banking = {}

          for name, series_id in SERIES.items():
              federal_banking[name] = latest_observation(
                  series_id
              )

          federal_banking["last_updated"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
          )

          federal_banking["source"] = (
              "Federal Reserve / FRED"
          )

          data = {
              "federal_banking": federal_banking
          }

          with open(
              "financial-data.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(data, file, indent=2)
              file.write("\n")

          print("Financial data retrieved successfully:")
          print(json.dumps(data, indent=2))
          PY

      - name: Commit updated financial data
        run: |
          git config user.name "MoneyTrack Data Bot"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add financial-data.json

          if git diff --cached --quiet; then
            echo "Financial data is already current."
          else
            git commit -m "Update Federal banking data"
            git push
          fi
