name: Update Financial Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download Federal Reserve and Treasury data
        run: |
          python <<'PY'
          import csv
          import io
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          # ----------------------------------------
          # Federal Reserve / FRED
          # ----------------------------------------

          SERIES = {
              "federal_funds_rate": "DFF",
              "bank_prime_loan_rate": "DPRIME",
              "interest_on_reserve_balances": "IORB"
          }

          def fetch_url(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "MoneyTrackTemplates Financial Data Bot"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return response.read()

          def latest_fred_observation(series_id):
              url = (
                  "https://fred.stlouisfed.org/graph/"
                  f"fredgraph.csv?id={series_id}"
              )

              text = fetch_url(url).decode("utf-8-sig")

              reader = csv.DictReader(io.StringIO(text))

              if not reader.fieldnames:
                  raise RuntimeError(
                      f"No CSV columns returned for {series_id}"
                  )

              date_columns = [
                  column
                  for column in reader.fieldnames
                  if column != series_id
              ]

              if not date_columns:
                  raise RuntimeError(
                      f"Could not identify date column "
                      f"for {series_id}. "
                      f"Columns returned: {reader.fieldnames}"
                  )

              date_column = date_columns[0]
              rows = list(reader)

              for row in reversed(rows):
                  value = row.get(series_id)

                  if value and value.strip() not in ("", "."):
                      return {
                          "value": float(value),
                          "observation_date":
                              row.get(date_column)
                      }

              raise RuntimeError(
                  f"No valid observations found for {series_id}"
              )

          federal_banking = {}

          for name, series_id in SERIES.items():
              federal_banking[name] = (
                  latest_fred_observation(series_id)
              )

          federal_banking["source"] = (
              "Federal Reserve / FRED"
          )

          # ----------------------------------------
          # U.S. Treasury
          # Daily Treasury Par Yield Curve Rates
          # ----------------------------------------

          def latest_treasury_rates():
              current_year = datetime.now(
                  timezone.utc
              ).year

              url = (
                  "https://home.treasury.gov/"
                  "resource-center/data-chart-center/"
                  "interest-rates/pages/xml"
                  "?data=daily_treasury_yield_curve"
                  f"&field_tdr_date_value={current_year}"
              )

              xml_bytes = fetch_url(url)
              root = ET.fromstring(xml_bytes)

              namespaces = {
                  "atom":
                      "http://www.w3.org/2005/Atom",
                  "m":
                      "http://schemas.microsoft.com/"
                      "ado/2007/08/dataservices/metadata",
                  "d":
                      "http://schemas.microsoft.com/"
                      "ado/2007/08/dataservices"
              }

              observations = []

              for entry in root.findall(
                  "atom:entry",
                  namespaces
              ):
                  properties = entry.find(
                      "atom:content/m:properties",
                      namespaces
                  )

                  if properties is None:
                      continue

                  def get_text(field):
                      element = properties.find(
                          f"d:{field}",
                          namespaces
                      )

                      if element is None:
                          return None

                      return element.text

                  date_text = get_text("NEW_DATE")

                  three_month = get_text(
                      "BC_3MONTH"
                  )

                  two_year = get_text(
                      "BC_2YEAR"
                  )

                  ten_year = get_text(
                      "BC_10YEAR"
                  )

                  if (
                      date_text
                      and three_month
                      and two_year
                      and ten_year
                  ):
                      observations.append({
                          "date": date_text[:10],
                          "three_month":
                              float(three_month),
                          "two_year":
                              float(two_year),
                          "ten_year":
                              float(ten_year)
                      })

              if not observations:
                  raise RuntimeError(
                      "No valid Treasury yield "
                      "curve observations returned."
                  )

              observations.sort(
                  key=lambda item: item["date"]
              )

              latest = observations[-1]

              return {
                  "three_month_rate": {
                      "value":
                          latest["three_month"],
                      "observation_date":
                          latest["date"]
                  },
                  "two_year_rate": {
                      "value":
                          latest["two_year"],
                      "observation_date":
                          latest["date"]
                  },
                  "ten_year_rate": {
                      "value":
                          latest["ten_year"],
                      "observation_date":
                          latest["date"]
                  },
                  "source":
                      "U.S. Department of the Treasury"
              }

          treasury = latest_treasury_rates()

          # ----------------------------------------
          # Save combined data
          # ----------------------------------------

          updated = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
          )

          federal_banking["last_updated"] = updated
          treasury["last_updated"] = updated

          data = {
              "federal_banking":
                  federal_banking,
              "treasury":
                  treasury
          }

          with open(
              "financial-data.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  data,
                  file,
                  indent=2
              )
              file.write("\n")

          print(
              "Financial data retrieved successfully:"
          )

          print(
              json.dumps(
                  data,
                  indent=2
              )
          )
          PY

      - name: Commit updated financial data
        run: |
          git config user.name "MoneyTrack Data Bot"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add financial-data.json

          if git diff --cached --quiet; then
            echo "Financial data is already current."
          else
            git commit -m "Update financial data"
            git push
          fi
