name: Update Financial Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download latest Federal Reserve data
        run: |
          python <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone

          SERIES = {
              "federal_funds_rate": "DFF",
              "bank_prime_loan_rate": "DPRIME",
              "interest_on_reserve_balances": "IORB"
          }

          def latest_observation(series_id):
              url = (
                  "https://fred.stlouisfed.org/graph/"
                  f"fredgraph.csv?id={series_id}"
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "MoneyTrackTemplates Financial Data Bot"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode("utf-8")

              rows = list(csv.DictReader(io.StringIO(text)))

              for row in reversed(rows):
                  value = row.get(series_id)

                  if value and value != ".":
                      return {
                          "value": float(value),
                          "observation_date": row["DATE"]
                      }

              raise RuntimeError(
                  f"No valid observations found for {series_id}"
              )

          data = {
              "federal_banking": {
                  "federal_funds_rate":
                      latest_observation("DFF"),

                  "bank_prime_loan_rate":
                      latest_observation("DPRIME"),

                  "interest_on_reserve_balances":
                      latest_observation("IORB"),

                  "last_updated":
                      datetime.now(timezone.utc)
                      .replace(microsecond=0)
                      .isoformat(),

                  "source": "Federal Reserve / FRED"
              }
          }

          with open("financial-data.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")

          print(json.dumps(data, indent=2))
          PY

      - name: Commit updated financial data
        run: |
          git config user.name "MoneyTrack Data Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add financial-data.json

          if git diff --cached --quiet; then
            echo "Financial data is already current."
          else
            git commit -m "Update Federal banking data"
            git push
          fi
